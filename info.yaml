# Tiny Tapeout project information
project:
  title: "RSA FO encryptor"
  author:       "Derek F"      # Your name
  discord:      "test"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Encryption-only FO demo with on-chip Keccak25-7 hashing"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 10000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_rsa_fo"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Active RTL tests are delegated by test/Makefile to the FO test runner.
  source_files:
    - "improvement_plan/rsa_alu.v"
    - "improvement_plan/rsa_modmul.v"
    - "improvement_plan/fo_transform/sha256_block.v"
    - "improvement_plan/fo_transform/tiny_hash7.v"
    - "improvement_plan/fo_transform/fo_hash.v"
    - "improvement_plan/fo_transform/rsa_adapter.v"
    - "improvement_plan/fo_transform/fo_engine.v"
    - "improvement_plan/fo_transform/project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CHUNK[0]"
  ui[1]: "CHUNK[1]"
  ui[2]: "CHUNK[2]"
  ui[3]: "CHUNK[3]"
  ui[4]: "CHUNK[4]"
  ui[5]: "CHUNK[5]"
  ui[6]: "CHUNK[6]"
  ui[7]: "LOAD"

  # Outputs
  uo[0]: "WORD[0]"
  uo[1]: "WORD[1]"
  uo[2]: "WORD[2]"
  uo[3]: "WORD[3]"
  uo[4]: "WORD[4]"
  uo[5]: "WORD[5]"
  uo[6]: "WORD[6]"
  uo[7]: "WORD[7]"

  # Bidirectional pins
  uio[0]: "WORD[8]"
  uio[1]: "WORD[9]"
  uio[2]: "WORD[10]"
  uio[3]: "WORD[11]"
  uio[4]: "ERROR"
  uio[5]: "HASH_REQUEST"
  uio[6]: "DONE"
  uio[7]: "CONTROL"

# Do not change!
yaml_version: 6
